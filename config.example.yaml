# masque-bricks configuration
# Copy this file to config.yaml and fill in your credentials

databricks:
  # Databricks workspace URL
  host: https://your-workspace.cloud.databricks.com

  # SQL warehouse HTTP path (find in SQL Warehouse > Connection details)
  http_path: /sql/1.0/warehouses/your-warehouse-id

  # Personal Access Token
  # Generate in Databricks: User settings > Developer > Access tokens
  token: <your-databricks-pat>

  # OAuth M2M (Service Principal) — use instead of token if preferred:
  # client_id: <your-service-principal-client-id>
  # client_secret: <your-service-principal-secret>

datamasque:
  # DataMasque instance URL
  host: https://datamasque.example.com
  # DataMasque login credentials
  username: <your-datamasque-username>
  password: <your-datamasque-password>
  # Verify the DataMasque TLS certificate. Default true (secure).
  # Set false only for instances with a self-signed cert you trust.
  # verify_ssl: true

s3:
  # S3 bucket for intermediate file storage
  bucket: your-masking-bucket
  # AWS region (optional, defaults to us-east-1)
  region: us-east-1
