[project]
name = "masque-bricks"
version = "0.1.0"
description = "CLI tool to orchestrate Databricks table masking via DataMasque file masking"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "databricks-sql-connector>=3.0.0",
    "requests>=2.31.0",
    "boto3>=1.34.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
masque-bricks = "masque_bricks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
